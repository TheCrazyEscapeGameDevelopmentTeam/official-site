<script>

const musicButton = document.getElementById("music-button");
const bgm = new Audio("audio/bgm.mp3");

musicButton.addEventListener("click", () => {

    if (bgm.paused) {

        bgm.loop = true;
        bgm.play();

        musicButton.classList.remove("muted");

    } else {

        bgm.pause();

        musicButton.classList.add("muted");

    }

});

</script>
