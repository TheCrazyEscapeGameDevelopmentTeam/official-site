<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- スマホ対応 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>登場人物紹介｜ぶっ飛んだ脱出ゲーム開発チーム</title>

    <meta
        name="description"
        content="ぶっ飛んだ脱出ゲームシリーズの公式サイト。ゲーム本編、スピンオフ、攻略情報などを掲載しています。"
    >

    <meta http-equiv="refresh" content="300">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="header-inner">

        <a href="#" class="logo">
            ぶっ飛んだ脱出ゲーム
        </a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="world.html">世界観</a>
            <a href="#games">ゲーム</a>
            <a href="#news">お知らせ</a>
            <a href="#about">チーム</a>
            <a href="#links">リンク</a>
            <button id="music-button" class="music-button" aria-label="BGMを再生">
            ♪
            </button>
        </nav>

    </div>
</header>
<section class="section">

    <div class="section-title">
        <p>CHARACTERS</p>
        <h1>登場人物</h1>
    </div>

    <div class="character-grid">

        <article class="character-card">

            <div class="character-image">
                <img src="images/cut.png" alt="カット">
            </div>

            <div class="character-content">
                <p class="character-role">MAIN CHARACTER</p>

                <h2>カット</h2>

                <p>
                    本シリーズの主人公。
                    様々な事件に巻き込まれ、
                    仲間たちとともに脱出を目指す。
                </p>
            </div>

        </article>


        <article class="character-card">

            <div class="character-image">
                <img src="images/gobo.png" alt="ゴボ">
            </div>

            <div class="character-content">
                <p class="character-role">CHARACTER</p>

                <h2>ゴボ</h2>

                <p>
                    カットの友達。
                    少しビビりな性格。
                </p>
            </div>

        </article>


        <article class="character-card">

            <div class="character-image">
                <img src="images/giga.png" alt="ギガ">
            </div>

            <div class="character-content">
                <p class="character-role">CHARACTER</p>

                <h2>ギガ</h2>

                <p>
                    カットの友達。
                    おとなしい性格。
                </p>
            </div>

        </article>


        <article class="character-card">

            <div class="character-image">
                <img src="images/pico.png" alt="ピコ">
            </div>

            <div class="character-content">
                <p class="character-role">CHARACTER</p>

                <h2>ピコ</h2>

                <p>
                    カットの友達。
                    倫理的・科学的な考え方をする。
                </p>
            </div>

        </article>


        <article class="character-card">

            <div class="character-image">
                <img src="images/terra.png" alt="テラ">
            </div>

            <div class="character-content">
                <p class="character-role">CHARACTER</p>

                <h2>テラ</h2>

                <p>
                    「ぶっ飛んだ脱出ゲームⅢ」に登場。
                    アメリカでカットたちを案内する大学生。
                </p>
            </div>

        </article>

    </div>

</section>
</html>
